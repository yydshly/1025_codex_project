<text x="72" y="78" font-size="25" fill="#8d503a" letter-spacing="2">AGENT SKILLS / 25项能力与使用场景</text>
<text x="72" y="164" font-size="58" font-weight="700" fill="#203a39">从问题到交付，一张图查清该用什么</text>
<text x="72" y="220" font-size="28" >每项都看五件事：做什么 · 什么时候用 · 怎么做 · 交付什么与怎样检查 · 怎么配合</text>
<text x="72" y="275" font-size="25" fill="#526665">先按当前问题找到工作阶段，再对照场景选技能；一个任务按需组合，无需每次走完全部25项。</text>
<rect x="72" y="320" width="305.14285714285717" height="156" rx="14" fill="#203a39"/>
<text x="92" y="355" font-size="22" fill="#ffffff">01 / 1项</text>
<text x="92" y="395" font-size="26" fill="#ffffff">选择工作方法</text>
<text x="379.14285714285717" y="405" font-size="22" fill="#526665">→</text>
<rect x="397.14285714285717" y="320" width="305.14285714285717" height="156" rx="14" fill="#e5ece5"/>
<text x="417.14285714285717" y="355" font-size="22" fill="#203a39">02 / 4项</text>
<text x="417.14285714285717" y="395" font-size="26" fill="#203a39">明确目标与底线</text>
<text x="704.2857142857143" y="405" font-size="22" fill="#526665">→</text>
<rect x="722.2857142857143" y="320" width="305.14285714285717" height="156" rx="14" fill="#e5ece5"/>
<text x="742.2857142857143" y="355" font-size="22" fill="#203a39">03 / 3项</text>
<text x="742.2857142857143" y="395" font-size="26" fill="#203a39">准备执行</text>
<text x="1029.4285714285716" y="405" font-size="22" fill="#526665">→</text>
<rect x="1047.4285714285716" y="320" width="305.14285714285717" height="156" rx="14" fill="#e5ece5"/>
<text x="1067.4285714285716" y="355" font-size="22" fill="#203a39">04 / 4项</text>
<text x="1067.4285714285716" y="395" font-size="26" fill="#203a39">实现功能</text>
<text x="1354.5714285714287" y="405" font-size="22" fill="#526665">→</text>
<rect x="1372.5714285714287" y="320" width="305.14285714285717" height="156" rx="14" fill="#e5ece5"/>
<text x="1392.5714285714287" y="355" font-size="22" fill="#203a39">05 / 3项</text>
<text x="1392.5714285714287" y="395" font-size="26" fill="#203a39">验证、质疑与纠错</text>
<text x="1679.7142857142858" y="405" font-size="22" fill="#526665">→</text>
<rect x="1697.7142857142858" y="320" width="305.14285714285717" height="156" rx="14" fill="#e5ece5"/>
<text x="1717.7142857142858" y="355" font-size="22" fill="#203a39">06 / 4项</text>
<text x="1717.7142857142858" y="395" font-size="26" fill="#203a39">检查并改善质量</text>
<text x="2004.857142857143" y="405" font-size="22" fill="#526665">→</text>
<rect x="2022.8571428571431" y="320" width="305.14285714285717" height="156" rx="14" fill="#e5ece5"/>
<text x="2042.8571428571431" y="355" font-size="22" fill="#203a39">07 / 6项</text>
<text x="2042.8571428571431" y="395" font-size="26" fill="#203a39">交付与持续维护</text>
<text x="72" y="527" font-size="25" fill="#526665">贯穿配合：上下文与来源支撑执行；约束、测试、审查检查质量；出现问题时回到相关步骤；文档、版本与观测持续保留依据。</text>
<rect x="72" y="570" width="2256" height="70" fill="#203a39"/>
<text x="90" y="614" font-size="25" fill="#ffffff" font-weight="700">技能 / 对应问题</text>
<text x="350" y="614" font-size="25" fill="#ffffff" font-weight="700">做什么</text>
<text x="680" y="614" font-size="25" fill="#ffffff" font-weight="700">什么时候用</text>
<text x="1060" y="614" font-size="25" fill="#ffffff" font-weight="700">怎么做：步骤、判断、约束</text>
<text x="1560" y="614" font-size="25" fill="#ffffff" font-weight="700">交付什么 / 怎样检查</text>
<text x="1960" y="614" font-size="25" fill="#ffffff" font-weight="700">怎么配合</text>
<rect x="72" y="640" width="2256" height="65" fill="#dce6dc"/>
<text x="92" y="682" font-size="27" font-weight="700">01  选择工作方法 · 1项</text>
<text x="722" y="682" font-size="24" fill="#526665">现在该从哪一步进入？</text>
<rect x="72" y="705" width="2256" height="160" fill="#fffefa"/>
<path d="M72 865H2328" stroke="#cad3c9"/>
<text x="90" y="739" font-size="19" fill="#8d503a">01</text>
<text x="90" y="777" font-size="25" fill="#263c3b">技能选择与协作</text>
<text x="350" y="743" font-size="22" fill="#263c3b">判断任务当前处于哪个阶段，</text><text x="350" y="775" font-size="22" fill="#263c3b">选择需要的工程方法，安排接</text><text x="350" y="807" font-size="22" fill="#263c3b">力顺序，避免遗漏关键环节。</text>
<text x="680" y="743" font-size="22" fill="#263c3b">当继续完善研究回查，却还不清楚</text><text x="680" y="775" font-size="22" fill="#263c3b">应先补需求、写代码还是验证结果</text><text x="680" y="807" font-size="22" fill="#263c3b">时，用它确定入口。</text>
<text x="1060" y="743" font-size="22" fill="#263c3b">识别当前问题→选相关技能→交接产物；随进展</text><text x="1060" y="775" font-size="22" fill="#263c3b">调整路线，只选需要的技能，不一次套用全部。</text>
<text x="1560" y="743" font-size="22" fill="#263c3b">交付任务路线和选择理由；检查每项</text><text x="1560" y="775" font-size="22" fill="#263c3b">都对应具体问题，下一步所需材料和</text><text x="1560" y="807" font-size="22" fill="#263c3b">进入条件清楚。</text>
<text x="1960" y="743" font-size="22" fill="#263c3b">目标不清接需求访谈；目标清楚接</text><text x="1960" y="775" font-size="22" fill="#263c3b">规格与规划；执行中出错转调试，</text><text x="1960" y="807" font-size="22" fill="#263c3b">上下文贯穿各阶段。</text>
<rect x="72" y="865" width="2256" height="65" fill="#dce6dc"/>
<text x="92" y="907" font-size="27" font-weight="700">02  明确目标与底线 · 4项</text>
<text x="722" y="907" font-size="24" fill="#526665">为什么做、做什么、怎样算好？</text>
<rect x="72" y="930" width="2256" height="160" fill="#f0f2eb"/>
<path d="M72 1090H2328" stroke="#cad3c9"/>
<text x="90" y="964" font-size="19" fill="#8d503a">02</text>
<text x="90" y="1002" font-size="25" fill="#263c3b">需求访谈</text>
<text x="350" y="968" font-size="22" fill="#263c3b">把模糊愿望变成清楚的用户目</text><text x="350" y="1000" font-size="22" fill="#263c3b">标、使用情境和成功标准，减</text><text x="350" y="1032" font-size="22" fill="#263c3b">少凭猜测开始建设的偏差。</text>
<text x="680" y="968" font-size="22" fill="#263c3b">如果只说“让过去的研究更有用”</text><text x="680" y="1000" font-size="22" fill="#263c3b">，还未明确要找原文、理解知识还</text><text x="680" y="1032" font-size="22" fill="#263c3b">是安排复习时。</text>
<text x="1060" y="968" font-size="22" fill="#263c3b">复述当前理解→逐次问关键问题→核对使用者、</text><text x="1060" y="1000" font-size="22" fill="#263c3b">目标和限制；允许用户纠正，避免引导答案。</text>
<text x="1560" y="968" font-size="22" fill="#263c3b">交付意图说明、具体使用任务和未决</text><text x="1560" y="1000" font-size="22" fill="#263c3b">问题；检查能用用户的话说清“做到</text><text x="1560" y="1032" font-size="22" fill="#263c3b">什么才有用”。</text>
<text x="1960" y="968" font-size="22" fill="#263c3b">意图明确后交想法细化比较方案；</text><text x="1960" y="1000" font-size="22" fill="#263c3b">方向已确定时可直接交规格，把目</text><text x="1960" y="1032" font-size="22" fill="#263c3b">标转换成验收行为。</text>
<rect x="72" y="1090" width="2256" height="160" fill="#fffefa"/>
<path d="M72 1250H2328" stroke="#cad3c9"/>
<text x="90" y="1124" font-size="19" fill="#8d503a">03</text>
<text x="90" y="1162" font-size="25" fill="#263c3b">想法细化与方向选</text><text x="90" y="1194" font-size="25" fill="#263c3b">择</text>
<text x="350" y="1128" font-size="22" fill="#263c3b">把一个粗略想法展开为几种不</text><text x="350" y="1160" font-size="22" fill="#263c3b">同方案，再比较价值、成本与</text><text x="350" y="1192" font-size="22" fill="#263c3b">假设，收敛到最小可行方向。</text>
<text x="680" y="1128" font-size="22" fill="#263c3b">如果想复用 PromptHub 研究中的</text><text x="680" y="1160" font-size="22" fill="#263c3b">工作经验，犹豫采用经验卡、参数</text><text x="680" y="1192" font-size="22" fill="#263c3b">模板还是自动提炼时。</text>
<text x="1060" y="1128" font-size="22" fill="#263c3b">明确问题→发散方案→比较取舍→收敛范围；列</text><text x="1060" y="1160" font-size="22" fill="#263c3b">出待验证假设，不能把预期价值写成事实。</text>
<text x="1560" y="1128" font-size="22" fill="#263c3b">交付一页方案比较、推荐理由和最小</text><text x="1560" y="1160" font-size="22" fill="#263c3b">范围；用同一输入演示各方案，检查</text><text x="1560" y="1192" font-size="22" fill="#263c3b">差异确实可比较。</text>
<text x="1960" y="1128" font-size="22" fill="#263c3b">需求不清先接需求访谈；选定方向</text><text x="1960" y="1160" font-size="22" fill="#263c3b">后交规格和规划；重要假设可交独</text><text x="1960" y="1192" font-size="22" fill="#263c3b">立质疑寻找反例。</text>
<rect x="72" y="1250" width="2256" height="160" fill="#f0f2eb"/>
<path d="M72 1410H2328" stroke="#cad3c9"/>
<text x="90" y="1284" font-size="19" fill="#8d503a">04</text>
<text x="90" y="1322" font-size="25" fill="#263c3b">规格驱动开发</text>
<text x="350" y="1288" font-size="22" fill="#263c3b">把选中的方向写成明确的功能</text><text x="350" y="1320" font-size="22" fill="#263c3b">行为、边界和验收条件，让实</text><text x="350" y="1352" font-size="22" fill="#263c3b">现与检查依据同一份说明。</text>
<text x="680" y="1288" font-size="22" fill="#263c3b">如果研究回查要新增“只导出当前</text><text x="680" y="1320" font-size="22" fill="#263c3b">项目的判断”，需要说清导出范围</text><text x="680" y="1352" font-size="22" fill="#263c3b">、空结果和失败反馈时。</text>
<text x="1060" y="1288" font-size="22" fill="#263c3b">确认范围→必要时拆模块→写正常、异常和边界</text><text x="1060" y="1320" font-size="22" fill="#263c3b">行为→定验收；需求变更同步更新规格。</text>
<text x="1560" y="1288" font-size="22" fill="#263c3b">交付行为规格与验收表；给定两个项</text><text x="1560" y="1320" font-size="22" fill="#263c3b">目的判断，能明确指出导出包含什么</text><text x="1560" y="1352" font-size="22" fill="#263c3b">、如何处理错误。</text>
<text x="1960" y="1288" font-size="22" fill="#263c3b">规格交规划拆任务、交接口设计定</text><text x="1960" y="1320" font-size="22" fill="#263c3b">契约、交测试转成用例；共同质量</text><text x="1960" y="1352" font-size="22" fill="#263c3b">底线由约束驱动补充。</text>
<rect x="72" y="1410" width="2256" height="160" fill="#fffefa"/>
<path d="M72 1570H2328" stroke="#cad3c9"/>
<text x="90" y="1444" font-size="19" fill="#8d503a">05</text>
<text x="90" y="1482" font-size="25" fill="#263c3b">质量约束与检查门</text><text x="90" y="1514" font-size="25" fill="#263c3b">槛</text>
<text x="350" y="1448" font-size="22" fill="#263c3b">把项目必须长期守住的质量要</text><text x="350" y="1480" font-size="22" fill="#263c3b">求写成约束，并安排检查，减</text><text x="350" y="1512" font-size="22" fill="#263c3b">少迭代时悄悄降低标准。</text>
<text x="680" y="1448" font-size="22" fill="#263c3b">当研究回查继续改动搜索或保存，</text><text x="680" y="1480" font-size="22" fill="#263c3b">需要持续守住“不改原文、出处可</text><text x="680" y="1512" font-size="22" fill="#263c3b">核对、旧判断不被覆盖”时。</text>
<text x="1060" y="1448" font-size="22" fill="#263c3b">读现有基线→明确底线→指定检查和时机→复核</text><text x="1060" y="1480" font-size="22" fill="#263c3b">差异；阈值需有依据，失败时修原因。</text>
<text x="1560" y="1448" font-size="22" fill="#263c3b">交付约束表、检查命令与例外说明；</text><text x="1560" y="1480" font-size="22" fill="#263c3b">检查每条可核验，不能靠删断言、跳</text><text x="1560" y="1512" font-size="22" fill="#263c3b">过测试来通过。</text>
<text x="1960" y="1448" font-size="22" fill="#263c3b">规格定义本次功能，约束定义共同</text><text x="1960" y="1480" font-size="22" fill="#263c3b">底线；测试提供行为证据，审查查</text><text x="1960" y="1512" font-size="22" fill="#263c3b">绕过，持续集成重复执行。</text>
<rect x="72" y="1570" width="2256" height="65" fill="#dce6dc"/>
<text x="92" y="1612" font-size="27" font-weight="700">03  准备执行 · 3项</text>
<text x="722" y="1612" font-size="24" fill="#526665">先后顺序、上下文与依据是否足够？</text>
<rect x="72" y="1635" width="2256" height="160" fill="#f0f2eb"/>
<path d="M72 1795H2328" stroke="#cad3c9"/>
<text x="90" y="1669" font-size="19" fill="#8d503a">06</text>
<text x="90" y="1707" font-size="25" fill="#263c3b">规划与任务拆解</text>
<text x="350" y="1673" font-size="22" fill="#263c3b">把确定的目标拆成依赖有序、</text><text x="350" y="1705" font-size="22" fill="#263c3b">可以逐项验收的小任务，明确</text><text x="350" y="1737" font-size="22" fill="#263c3b">先做什么和每步何时完成。</text>
<text x="680" y="1673" font-size="22" fill="#263c3b">如果资料检索基线已确定，需要从</text><text x="680" y="1705" font-size="22" fill="#263c3b">一个问题的出处回查扩展到六题，</text><text x="680" y="1737" font-size="22" fill="#263c3b">又不想一次铺开全部时。</text>
<text x="1060" y="1673" font-size="22" fill="#263c3b">读规格和现状→画依赖→按完整路径切片→列验</text><text x="1060" y="1705" font-size="22" fill="#263c3b">收与风险；区分可并行任务和必须先做的任务。</text>
<text x="1560" y="1673" font-size="22" fill="#263c3b">交付计划、任务清单与检查点；每项</text><text x="1560" y="1705" font-size="22" fill="#263c3b">都能判断完成，先有一条“提问→段</text><text x="1560" y="1737" font-size="22" fill="#263c3b">落→核对”闭环。</text>
<text x="1960" y="1673" font-size="22" fill="#263c3b">接收规格与约束，交增量实现逐步</text><text x="1960" y="1705" font-size="22" fill="#263c3b">执行；接口设计解决模块边界，上</text><text x="1960" y="1737" font-size="22" fill="#263c3b">下文组织保存接力状态。</text>
<rect x="72" y="1795" width="2256" height="176" fill="#fffefa"/>
<path d="M72 1971H2328" stroke="#cad3c9"/>
<text x="90" y="1829" font-size="19" fill="#8d503a">07</text>
<text x="90" y="1867" font-size="25" fill="#263c3b">上下文组织与交接</text>
<text x="350" y="1833" font-size="22" fill="#263c3b">为助手准备当前任务真正需要</text><text x="350" y="1865" font-size="22" fill="#263c3b">的规则、源码和证据，减少资</text><text x="350" y="1897" font-size="22" fill="#263c3b">料不足、上下文过多和交接失</text><text x="350" y="1929" font-size="22" fill="#263c3b">真。</text>
<text x="680" y="1833" font-size="22" fill="#263c3b">当隔天继续研究回查，或换一个助</text><text x="680" y="1865" font-size="22" fill="#263c3b">手接手，需要恢复已定范围、未完</text><text x="680" y="1897" font-size="22" fill="#263c3b">成项及真实验证状态时。</text>
<text x="1060" y="1833" font-size="22" fill="#263c3b">先读项目规则→按任务取必要资料→保留错误与</text><text x="1060" y="1865" font-size="22" fill="#263c3b">决策→写交接；过期信息重新核对，不堆全库。</text>
<text x="1560" y="1833" font-size="22" fill="#263c3b">交付最小上下文包和交接记录；新执</text><text x="1560" y="1865" font-size="22" fill="#263c3b">行者能找到任务、相关文件、已验证</text><text x="1560" y="1897" font-size="22" fill="#263c3b">项和下一步动作。</text>
<text x="1960" y="1833" font-size="22" fill="#263c3b">贯穿规划、实现与调试；文档和决</text><text x="1960" y="1865" font-size="22" fill="#263c3b">策记录提供长期依据，官方资料校</text><text x="1960" y="1897" font-size="22" fill="#263c3b">验补足版本相关信息。</text>
<rect x="72" y="1971" width="2256" height="160" fill="#f0f2eb"/>
<path d="M72 2131H2328" stroke="#cad3c9"/>
<text x="90" y="2005" font-size="19" fill="#8d503a">08</text>
<text x="90" y="2043" font-size="25" fill="#263c3b">依据官方资料开发</text>
<text x="350" y="2009" font-size="22" fill="#263c3b">把依赖框架或库的实现选择建</text><text x="350" y="2041" font-size="22" fill="#263c3b">立在官方资料和实际版本上，</text><text x="350" y="2073" font-size="22" fill="#263c3b">减少照搬过时 API 与用法。</text>
<text x="680" y="2009" font-size="22" fill="#263c3b">如果研究项目准备接入某个检索库</text><text x="680" y="2041" font-size="22" fill="#263c3b">，而分块、过滤或调用参数依赖具</text><text x="680" y="2073" font-size="22" fill="#263c3b">体版本时，应先查官方依据。</text>
<text x="1060" y="2009" font-size="22" fill="#263c3b">识别技术栈与版本→查对应官方文档→按文档实</text><text x="1060" y="2041" font-size="22" fill="#263c3b">现→附来源；普通改名等版本无关操作按需简化</text><text x="1060" y="2073" font-size="22" fill="#263c3b">。</text>
<text x="1560" y="2009" font-size="22" fill="#263c3b">交付有版本、原文链接与依据的实现</text><text x="1560" y="2041" font-size="22" fill="#263c3b">；核对来源确实支持该用法，并在本</text><text x="1560" y="2073" font-size="22" fill="#263c3b">项目运行检查。</text>
<text x="1960" y="2009" font-size="22" fill="#263c3b">为接口设计和增量实现提供依据；</text><text x="1960" y="2041" font-size="22" fill="#263c3b">测试检查实际行为，审查核对引用</text><text x="1960" y="2073" font-size="22" fill="#263c3b">与实现是否相符。</text>
<rect x="72" y="2131" width="2256" height="65" fill="#dce6dc"/>
<text x="92" y="2173" font-size="27" font-weight="700">04  实现功能 · 4项</text>
<text x="722" y="2173" font-size="24" fill="#526665">怎样逐步做出可用、可测试的东西？</text>
<rect x="72" y="2196" width="2256" height="176" fill="#fffefa"/>
<path d="M72 2372H2328" stroke="#cad3c9"/>
<text x="90" y="2230" font-size="19" fill="#8d503a">09</text>
<text x="90" y="2268" font-size="25" fill="#263c3b">增量实现</text>
<text x="350" y="2234" font-size="22" fill="#263c3b">把实现按最小完整功能逐块推</text><text x="350" y="2266" font-size="22" fill="#263c3b">进，每块先能运行和核验，再</text><text x="350" y="2298" font-size="22" fill="#263c3b">扩展下一块，限制失败排查范</text><text x="350" y="2330" font-size="22" fill="#263c3b">围。</text>
<text x="680" y="2234" font-size="22" fill="#263c3b">如果要实现六题研究检索，可以先</text><text x="680" y="2266" font-size="22" fill="#263c3b">打通一题的输入、搜索、出处展示</text><text x="680" y="2298" font-size="22" fill="#263c3b">，再扩展其他材料时。</text>
<text x="1060" y="2234" font-size="22" fill="#263c3b">选一条最小完整路径→实现→测试与真实操作→</text><text x="1060" y="2266" font-size="22" fill="#263c3b">保存进度→继续；当前失败先修，不顺带加需求</text><text x="1060" y="2298" font-size="22" fill="#263c3b">。</text>
<text x="1560" y="2234" font-size="22" fill="#263c3b">交付逐步可用的版本和验证记录；每</text><text x="1560" y="2266" font-size="22" fill="#263c3b">一步能实际输入问题、打开来源，并</text><text x="1560" y="2298" font-size="22" fill="#263c3b">说明剩余工作。</text>
<text x="1960" y="2234" font-size="22" fill="#263c3b">按规划任务执行，内部配合测试；</text><text x="1960" y="2266" font-size="22" fill="#263c3b">页面交浏览器验证，完成的小步交 </text><text x="1960" y="2298" font-size="22" fill="#263c3b">Git 保存与代码审查。</text>
<rect x="72" y="2372" width="2256" height="176" fill="#f0f2eb"/>
<path d="M72 2548H2328" stroke="#cad3c9"/>
<text x="90" y="2406" font-size="19" fill="#8d503a">10</text>
<text x="90" y="2444" font-size="25" fill="#263c3b">测试驱动开发</text>
<text x="350" y="2410" font-size="22" fill="#263c3b">用预期行为的测试先暴露缺口</text><text x="350" y="2442" font-size="22" fill="#263c3b">，再做最小实现并整理代码，</text><text x="350" y="2474" font-size="22" fill="#263c3b">让故障修复留下可重复的回归</text><text x="350" y="2506" font-size="22" fill="#263c3b">检查。</text>
<text x="680" y="2410" font-size="22" fill="#263c3b">如果卡片收藏将增加新的备份校验</text><text x="680" y="2442" font-size="22" fill="#263c3b">规则，或已有规则出现可复现错误</text><text x="680" y="2474" font-size="22" fill="#263c3b">，需要保护旧收藏行为时。</text>
<text x="1060" y="2410" font-size="22" fill="#263c3b">确认测试方式→写行为用例并观察目标失败→最</text><text x="1060" y="2442" font-size="22" fill="#263c3b">小实现→通过后整理；不能故意破坏代码制造红</text><text x="1060" y="2474" font-size="22" fill="#263c3b">灯。</text>
<text x="1560" y="2410" font-size="22" fill="#263c3b">交付失败到通过的记录及回归用例；</text><text x="1560" y="2442" font-size="22" fill="#263c3b">新规则和旧保护行为都满足断言，且</text><text x="1560" y="2474" font-size="22" fill="#263c3b">失败原因确为行为缺口。</text>
<text x="1960" y="2410" font-size="22" fill="#263c3b">从规格提取预期，配合增量实现；</text><text x="1960" y="2442" font-size="22" fill="#263c3b">调试提供故障样本，浏览器验证补</text><text x="1960" y="2474" font-size="22" fill="#263c3b">足真实界面与集成检查。</text>
<rect x="72" y="2548" width="2256" height="176" fill="#fffefa"/>
<path d="M72 2724H2328" stroke="#cad3c9"/>
<text x="90" y="2582" font-size="19" fill="#8d503a">11</text>
<text x="90" y="2620" font-size="25" fill="#263c3b">前端界面工程</text>
<text x="350" y="2586" font-size="22" fill="#263c3b">把功能做成可读、可操作、适</text><text x="350" y="2618" font-size="22" fill="#263c3b">配不同屏幕的界面，处理状态</text><text x="350" y="2650" font-size="22" fill="#263c3b">反馈、可访问性和视觉一致性</text><text x="350" y="2682" font-size="22" fill="#263c3b">。</text>
<text x="680" y="2586" font-size="22" fill="#263c3b">如果研究回查要新增出处面板，需</text><text x="680" y="2618" font-size="22" fill="#263c3b">要在手机、键盘操作和空结果状态</text><text x="680" y="2650" font-size="22" fill="#263c3b">下都能理解和使用时。</text>
<text x="1060" y="2586" font-size="22" fill="#263c3b">梳理用户路径→复用设计规则→实现正常、加载</text><text x="1060" y="2618" font-size="22" fill="#263c3b">、空白、失败状态→检查响应式与键盘操作。</text>
<text x="1560" y="2586" font-size="22" fill="#263c3b">交付可操作界面及状态样例；检查窄</text><text x="1560" y="2618" font-size="22" fill="#263c3b">屏无重要内容溢出、焦点清楚、错误</text><text x="1560" y="2650" font-size="22" fill="#263c3b">反馈和主要操作可用。</text>
<text x="1960" y="2586" font-size="22" fill="#263c3b">规格提供行为，接口设计确定数据</text><text x="1960" y="2618" font-size="22" fill="#263c3b">；浏览器验证检查真实显示，性能</text><text x="1960" y="2650" font-size="22" fill="#263c3b">与安全按具体风险参与。</text>
<rect x="72" y="2724" width="2256" height="176" fill="#f0f2eb"/>
<path d="M72 2900H2328" stroke="#cad3c9"/>
<text x="90" y="2758" font-size="19" fill="#8d503a">12</text>
<text x="90" y="2796" font-size="25" fill="#263c3b">接口与契约设计</text>
<text x="350" y="2762" font-size="22" fill="#263c3b">明确模块之间可依赖的输入、</text><text x="350" y="2794" font-size="22" fill="#263c3b">输出和错误行为，降低调用歧</text><text x="350" y="2826" font-size="22" fill="#263c3b">义，避免实现细节变成隐性承</text><text x="350" y="2858" font-size="22" fill="#263c3b">诺。</text>
<text x="680" y="2762" font-size="22" fill="#263c3b">如果研究回查的检索模块与界面要</text><text x="680" y="2794" font-size="22" fill="#263c3b">共用结果，或判断备份需要明确版</text><text x="680" y="2826" font-size="22" fill="#263c3b">本与错误结构时。</text>
<text x="1060" y="2762" font-size="22" fill="#263c3b">识别调用方→写参数、返回和失败契约→用例对</text><text x="1060" y="2794" font-size="22" fill="#263c3b">齐→考虑兼容；已有使用者依赖的行为要谨慎改</text><text x="1060" y="2826" font-size="22" fill="#263c3b">。</text>
<text x="1560" y="2762" font-size="22" fill="#263c3b">交付接口契约与调用样例；正常、缺</text><text x="1560" y="2794" font-size="22" fill="#263c3b">失、错误和版本不符输入都有确定结</text><text x="1560" y="2826" font-size="22" fill="#263c3b">果，调用方能验证。</text>
<text x="1960" y="2762" font-size="22" fill="#263c3b">承接规格并支撑前后端实现；测试</text><text x="1960" y="2794" font-size="22" fill="#263c3b">核对契约，安全检查绕过路径，破</text><text x="1960" y="2826" font-size="22" fill="#263c3b">坏兼容的变化交迁移处理。</text>
<rect x="72" y="2900" width="2256" height="65" fill="#dce6dc"/>
<text x="92" y="2942" font-size="27" font-weight="700">05  验证、质疑与纠错 · 3项</text>
<text x="722" y="2942" font-size="24" fill="#526665">真的能用吗？出问题后怎么办？</text>
<rect x="72" y="2965" width="2256" height="176" fill="#fffefa"/>
<path d="M72 3141H2328" stroke="#cad3c9"/>
<text x="90" y="2999" font-size="19" fill="#8d503a">13</text>
<text x="90" y="3037" font-size="25" fill="#263c3b">浏览器运行验证</text>
<text x="350" y="3003" font-size="22" fill="#263c3b">在真实浏览器中操作并读取页</text><text x="350" y="3035" font-size="22" fill="#263c3b">面、控制台、网络或性能证据</text><text x="350" y="3067" font-size="22" fill="#263c3b">，核实代码修改后的实际用户</text><text x="350" y="3099" font-size="22" fill="#263c3b">路径。</text>
<text x="680" y="3003" font-size="22" fill="#263c3b">当卡片按钮、研究回查来源跳转或</text><text x="680" y="3035" font-size="22" fill="#263c3b">窄屏布局改完，需要确认真实点击</text><text x="680" y="3067" font-size="22" fill="#263c3b">和显示确实正常时。</text>
<text x="1060" y="3003" font-size="22" fill="#263c3b">确认浏览器工具可用→复现操作→查看页面与运</text><text x="1060" y="3035" font-size="22" fill="#263c3b">行信息→核对修复；保留证据，不能只看代码下</text><text x="1060" y="3067" font-size="22" fill="#263c3b">结论。</text>
<text x="1560" y="3003" font-size="22" fill="#263c3b">交付关键路径操作记录、截图和运行</text><text x="1560" y="3035" font-size="22" fill="#263c3b">问题；实际走通输入、结果、出处等</text><text x="1560" y="3067" font-size="22" fill="#263c3b">流程，核对控制台错误。</text>
<text x="1960" y="3003" font-size="22" fill="#263c3b">配合前端与增量实现验收；发现错</text><text x="1960" y="3035" font-size="22" fill="#263c3b">误交调试，性能轨迹交优化，最终</text><text x="1960" y="3067" font-size="22" fill="#263c3b">目标环境检查服务发布。</text>
<rect x="72" y="3141" width="2256" height="160" fill="#f0f2eb"/>
<path d="M72 3301H2328" stroke="#cad3c9"/>
<text x="90" y="3175" font-size="19" fill="#8d503a">14</text>
<text x="90" y="3213" font-size="25" fill="#263c3b">系统调试与恢复</text>
<text x="350" y="3179" font-size="22" fill="#263c3b">把异常从现象追到可验证的根</text><text x="350" y="3211" font-size="22" fill="#263c3b">因，修复后验证并补回归，避</text><text x="350" y="3243" font-size="22" fill="#263c3b">免边猜边改把问题扩散。</text>
<text x="680" y="3179" font-size="22" fill="#263c3b">当研究回查找错仓库、保存失败，</text><text x="680" y="3211" font-size="22" fill="#263c3b">或卡片操作原本正常后来出现异常</text><text x="680" y="3243" font-size="22" fill="#263c3b">，需要查清原因时。</text>
<text x="1060" y="3179" font-size="22" fill="#263c3b">停止扩展→保留错误与复现步骤→缩小范围→验</text><text x="1060" y="3211" font-size="22" fill="#263c3b">证假设→修根因→复核；不能跳过失败继续堆功</text><text x="1060" y="3243" font-size="22" fill="#263c3b">能。</text>
<text x="1560" y="3179" font-size="22" fill="#263c3b">交付复现、根因、修复与回归证据；</text><text x="1560" y="3211" font-size="22" fill="#263c3b">同一输入不再触发旧故障，相关旧行</text><text x="1560" y="3243" font-size="22" fill="#263c3b">为也未被破坏。</text>
<text x="1960" y="3179" font-size="22" fill="#263c3b">浏览器与运行观测提供证据；测试</text><text x="1960" y="3211" font-size="22" fill="#263c3b">固定故障样本，代码审查检查修复</text><text x="1960" y="3243" font-size="22" fill="#263c3b">范围，验证通过再继续实现。</text>
<rect x="72" y="3301" width="2256" height="160" fill="#fffefa"/>
<path d="M72 3461H2328" stroke="#cad3c9"/>
<text x="90" y="3335" font-size="19" fill="#8d503a">15</text>
<text x="90" y="3373" font-size="25" fill="#263c3b">独立质疑</text>
<text x="350" y="3339" font-size="22" fill="#263c3b">在关键决定尚可调整时，用新</text><text x="350" y="3371" font-size="22" fill="#263c3b">上下文的独立审查主动找反例</text><text x="350" y="3403" font-size="22" fill="#263c3b">，检验自信结论背后的假设。</text>
<text x="680" y="3339" font-size="22" fill="#263c3b">如果计划升级判断备份格式，准备</text><text x="680" y="3371" font-size="22" fill="#263c3b">声称“旧数据一定能保留”，但尚</text><text x="680" y="3403" font-size="22" fill="#263c3b">未有足够证据时。</text>
<text x="1060" y="3339" font-size="22" fill="#263c3b">明确待检验主张→给独立执行者必要证据→要求</text><text x="1060" y="3371" font-size="22" fill="#263c3b">找反例→逐条核实→修改或保留；不用措辞自信</text><text x="1060" y="3403" font-size="22" fill="#263c3b">代替证据。</text>
<text x="1560" y="3339" font-size="22" fill="#263c3b">交付反例、风险与主张处理记录；每</text><text x="1560" y="3371" font-size="22" fill="#263c3b">个质疑都有事实依据，解决或接受风</text><text x="1560" y="3403" font-size="22" fill="#263c3b">险的理由可追溯。</text>
<text x="1960" y="3339" font-size="22" fill="#263c3b">可穿插方案、规格和实现的重要决</text><text x="1960" y="3371" font-size="22" fill="#263c3b">定；发现具体错误交调试，完成变</text><text x="1960" y="3403" font-size="22" fill="#263c3b">更再由代码审查综合判断。</text>
<rect x="72" y="3461" width="2256" height="65" fill="#dce6dc"/>
<text x="92" y="3503" font-size="27" font-weight="700">06  检查并改善质量 · 4项</text>
<text x="722" y="3503" font-size="24" fill="#526665">是否正确、安全、易维护、足够快？</text>
<rect x="72" y="3526" width="2256" height="176" fill="#f0f2eb"/>
<path d="M72 3702H2328" stroke="#cad3c9"/>
<text x="90" y="3560" font-size="19" fill="#8d503a">16</text>
<text x="90" y="3598" font-size="25" fill="#263c3b">代码审查与质量判</text><text x="90" y="3630" font-size="25" fill="#263c3b">断</text>
<text x="350" y="3564" font-size="22" fill="#263c3b">从正确性、可读性、结构、安</text><text x="350" y="3596" font-size="22" fill="#263c3b">全与性能检查具体变更，找出</text><text x="350" y="3628" font-size="22" fill="#263c3b">会影响需求和维护的实质问题</text><text x="350" y="3660" font-size="22" fill="#263c3b">。</text>
<text x="680" y="3564" font-size="22" fill="#263c3b">当研究回查或卡片功能修改完成，</text><text x="680" y="3596" font-size="22" fill="#263c3b">准备合并或交付，需要判断是否带</text><text x="680" y="3628" font-size="22" fill="#263c3b">入异常行为和多余改动时。</text>
<text x="1060" y="3564" font-size="22" fill="#263c3b">读需求与差异→核查五个维度→用证据定位问题</text><text x="1060" y="3596" font-size="22" fill="#263c3b">→复核修正；分清缺陷与个人偏好，不追求完美</text><text x="1060" y="3628" font-size="22" fill="#263c3b">才交付。</text>
<text x="1560" y="3564" font-size="22" fill="#263c3b">交付带位置、影响和依据的审查意见</text><text x="1560" y="3596" font-size="22" fill="#263c3b">；重要问题可复现或有清楚推理，修</text><text x="1560" y="3628" font-size="22" fill="#263c3b">复后检查相关行为。</text>
<text x="1960" y="3564" font-size="22" fill="#263c3b">读取规格、约束与测试结果；复杂</text><text x="1960" y="3596" font-size="22" fill="#263c3b">度交简化、风险交安全、慢的证据</text><text x="1960" y="3628" font-size="22" fill="#263c3b">交性能，收敛后进入发布。</text>

<text x="90" y="3736" font-size="19" fill="#8d503a">17</text>
<text x="90" y="3774" font-size="25" fill="#263c3b">代码简化</text>
<text x="350" y="3740" font-size="22" fill="#263c3b">在外部行为保持一致的前提下</text><text x="350" y="3772" font-size="22" fill="#263c3b">整理重复、嵌套与命名，让后</text><text x="350" y="3804" font-size="22" fill="#263c3b">来的人更容易理解和修改代码</text><text x="350" y="3836" font-size="22" fill="#263c3b">。</text>
<text x="680" y="3740" font-size="22" fill="#263c3b">如果卡片展示已经可用，但同一流</text><text x="680" y="3772" font-size="22" fill="#263c3b">程散落多处、分支难读，下一次修</text><text x="680" y="3804" font-size="22" fill="#263c3b">改容易遗漏时。</text>
<text x="1060" y="3740" font-size="22" fill="#263c3b">理解现有行为→固定可比较样例→小步整理结构</text><text x="1060" y="3772" font-size="22" fill="#263c3b">→核对前后；保持输入、输出、副作用和错误处</text><text x="1060" y="3804" font-size="22" fill="#263c3b">理一致。</text>
<text x="1560" y="3740" font-size="22" fill="#263c3b">交付更清晰的代码及行为对照；相同</text><text x="1560" y="3772" font-size="22" fill="#263c3b">角色、输入和异常条件产生一致结果</text><text x="1560" y="3804" font-size="22" fill="#263c3b">，原检查保持有效。</text>
<text x="1960" y="3740" font-size="22" fill="#263c3b">通常由代码审查发现机会，配合测</text><text x="1960" y="3772" font-size="22" fill="#263c3b">试和浏览器核对；版本管理保存边</text><text x="1960" y="3804" font-size="22" fill="#263c3b">界，新增功能另走规格。</text>

<text x="90" y="3912" font-size="19" fill="#8d503a">18</text>
<text x="90" y="3950" font-size="25" fill="#263c3b">安全检查与加固</text>
<text x="350" y="3916" font-size="22" fill="#263c3b">识别不可信输入与待保护资产</text><text x="350" y="3948" font-size="22" fill="#263c3b">，针对越权、篡改、泄漏和依</text><text x="350" y="3980" font-size="22" fill="#263c3b">赖风险设计实际检查与防护。</text>
<text x="680" y="3916" font-size="22" fill="#263c3b">当研究回查允许粘贴判断备份，外</text><text x="680" y="3948" font-size="22" fill="#263c3b">部 JSON 可能进入保存和页面显示</text><text x="680" y="3980" font-size="22" fill="#263c3b">，需要防止异常覆盖与脚本执行时</text><text x="680" y="4012" font-size="22" fill="#263c3b">。</text>
<text x="1060" y="3916" font-size="22" fill="#263c3b">标信任边界→列滥用场景→校验输入与权限→安</text><text x="1060" y="3948" font-size="22" fill="#263c3b">全显示→验证异常；控制日志字段，避免泄露正</text><text x="1060" y="3980" font-size="22" fill="#263c3b">文。</text>
<text x="1560" y="3916" font-size="22" fill="#263c3b">交付边界说明、加固项和异常样例；</text><text x="1560" y="3948" font-size="22" fill="#263c3b">非法输入被拒绝、原记录未变，文本</text><text x="1560" y="3980" font-size="22" fill="#263c3b">安全显示且残余风险明确。</text>
<text x="1960" y="3916" font-size="22" fill="#263c3b">接口契约确定允许输入，测试验证</text><text x="1960" y="3948" font-size="22" fill="#263c3b">拒绝行为；审查核对实现，运行观</text><text x="1960" y="3980" font-size="22" fill="#263c3b">测兼顾诊断与信息保护。</text>

<text x="90" y="4088" font-size="19" fill="#8d503a">19</text>
<text x="90" y="4126" font-size="25" fill="#263c3b">性能测量与优化</text>
<text x="350" y="4092" font-size="22" fill="#263c3b">先测量实际瓶颈，再做有依据</text><text x="350" y="4124" font-size="22" fill="#263c3b">的改动并重复比较，确认速度</text><text x="350" y="4156" font-size="22" fill="#263c3b">或资源改善值得增加的复杂度</text><text x="350" y="4188" font-size="22" fill="#263c3b">。</text>
<text x="680" y="4092" font-size="22" fill="#263c3b">如果交互物理书在某设备翻页或实</text><text x="680" y="4124" font-size="22" fill="#263c3b">验操作卡顿，需要区分资源加载、</text><text x="680" y="4156" font-size="22" fill="#263c3b">模型渲染与界面更新耗时时。</text>
<text x="1060" y="4092" font-size="22" fill="#263c3b">固定条件测基线→定位瓶颈→一次改一个环节→</text><text x="1060" y="4124" font-size="22" fill="#263c3b">同条件重复测量；保持功能正确，诚实记录无效</text><text x="1060" y="4156" font-size="22" fill="#263c3b">尝试。</text>
<text x="1560" y="4092" font-size="22" fill="#263c3b">交付测量条件、原始前后数据和取舍</text><text x="1560" y="4124" font-size="22" fill="#263c3b">理由；差异超过正常波动，画面、数</text><text x="1560" y="4156" font-size="22" fill="#263c3b">值与交互依然正确。</text>
<text x="1960" y="4092" font-size="22" fill="#263c3b">浏览器与运行观测提供线索，约束</text><text x="1960" y="4124" font-size="22" fill="#263c3b">明确性能目标；优化结果交审查，</text><text x="1960" y="4156" font-size="22" fill="#263c3b">必要时加入持续集成回归检查。</text>

<text x="722" y="4272" font-size="24" fill="#526665">怎样发布、观察、交接并安全升级？</text>
<rect x="72" y="4295" width="2256" height="176" fill="#f0f2eb"/>

<text x="90" y="4329" font-size="19" fill="#8d503a">20</text>
<text x="90" y="4367" font-size="25" fill="#263c3b">Git 工作流与版本</text>
<text x="350" y="4333" font-size="22" fill="#263c3b">按目的组织工作区、提交和版</text><text x="350" y="4365" font-size="22" fill="#263c3b">本，让本次变更的边界、原因</text><text x="350" y="4397" font-size="22" fill="#263c3b">与发布内容清楚可审查、可追</text><text x="350" y="4429" font-size="22" fill="#263c3b">溯。</text>
<text x="680" y="4333" font-size="22" fill="#263c3b">当总库多个编号项目同时有未提交</text><text x="680" y="4365" font-size="22" fill="#263c3b">工作，只准备保存某一个项目成果</text><text x="680" y="4397" font-size="22" fill="#263c3b">，或需要锁定发布版本时。</text>
<text x="1060" y="4333" font-size="22" fill="#263c3b">核对差异归属→按逻辑拆分→检查待提交内容与</text><text x="1060" y="4365" font-size="22" fill="#263c3b">验证结果→按授权提交和标记版本；遵循现有仓</text><text x="1060" y="4397" font-size="22" fill="#263c3b">库约定。</text>
<text x="1560" y="4333" font-size="22" fill="#263c3b">交付清楚的变更清单、提交与版本说</text><text x="1560" y="4365" font-size="22" fill="#263c3b">明；逐文件确认只含本次范围，其他</text><text x="1560" y="4397" font-size="22" fill="#263c3b">工作保留，敏感信息未混入。</text>
<text x="1960" y="4333" font-size="22" fill="#263c3b">增量实现提供小步成果，代码审查</text><text x="1960" y="4365" font-size="22" fill="#263c3b">核对差异，持续集成检查版本，发</text><text x="1960" y="4397" font-size="22" fill="#263c3b">布按确定版本交付。</text>

<text x="90" y="4505" font-size="19" fill="#8d503a">21</text>
<text x="90" y="4543" font-size="25" fill="#263c3b">持续集成与自动化</text>
<text x="350" y="4509" font-size="22" fill="#263c3b">把已认可的检查和构建交付步</text><text x="350" y="4541" font-size="22" fill="#263c3b">骤自动重复执行，提供失败反</text><text x="350" y="4573" font-size="22" fill="#263c3b">馈，并按平台规则阻止不合格</text><text x="350" y="4605" font-size="22" fill="#263c3b">变更。</text>
<text x="680" y="4509" font-size="22" fill="#263c3b">如果总库索引、检索和保存逻辑频</text><text x="680" y="4541" font-size="22" fill="#263c3b">繁修改，需要每次都检查编号、数</text><text x="680" y="4573" font-size="22" fill="#263c3b">据生成与行为而不靠记忆时。</text>
<text x="1060" y="4509" font-size="22" fill="#263c3b">核对本地命令→配置触发和环境→按成本运行→</text><text x="1060" y="4541" font-size="22" fill="#263c3b">保留失败→验证阻断；不能跳过失败项换绿灯。</text>
<text x="1560" y="4509" font-size="22" fill="#263c3b">交付流水线配置和实际运行记录；正</text><text x="1560" y="4541" font-size="22" fill="#263c3b">确版本通过，隔离错误失败；要求阻</text><text x="1560" y="4573" font-size="22" fill="#263c3b">断合并时核实平台规则。</text>
<text x="1960" y="4509" font-size="22" fill="#263c3b">约束提供门槛，测试提供可执行检</text><text x="1960" y="4541" font-size="22" fill="#263c3b">查，Git 提供版本；流水线执行步</text><text x="1960" y="4573" font-size="22" fill="#263c3b">骤，发布负责目标环境整体验收。</text>

<text x="90" y="4681" font-size="19" fill="#8d503a">22</text>
<text x="90" y="4719" font-size="25" fill="#263c3b">弃用与迁移</text>
<text x="350" y="4685" font-size="22" fill="#263c3b">先验证替代方案和兼容路径，</text><text x="350" y="4717" font-size="22" fill="#263c3b">再分阶段迁移使用者与数据，</text><text x="350" y="4749" font-size="22" fill="#263c3b">降低更换旧格式或系统造成的</text><text x="350" y="4781" font-size="22" fill="#263c3b">损失。</text>
<text x="680" y="4685" font-size="22" fill="#263c3b">如果研究判断备份确需升级格式，</text><text x="680" y="4717" font-size="22" fill="#263c3b">已有旧备份和旧页面仍在使用，需</text><text x="680" y="4749" font-size="22" fill="#263c3b">要兼容并保留原判断时。</text>
<text x="1060" y="4685" font-size="22" fill="#263c3b">盘点依赖→验证替代→保留兼容→分批转换和核</text><text x="1060" y="4717" font-size="22" fill="#263c3b">验→切换；先在副本验证，代码回退不等于恢复</text><text x="1060" y="4749" font-size="22" fill="#263c3b">数据。</text>
<text x="1560" y="4685" font-size="22" fill="#263c3b">交付迁移计划、适配方案和逐条核验</text><text x="1560" y="4717" font-size="22" fill="#263c3b">；正文与项目对应一致，未知字段不</text><text x="1560" y="4749" font-size="22" fill="#263c3b">编造，恢复路径经过检查。</text>
<text x="1960" y="4685" font-size="22" fill="#263c3b">接口设计明确兼容边界，增量实现</text><text x="1960" y="4717" font-size="22" fill="#263c3b">分阶段切换，运行观测发现旧调用</text><text x="1960" y="4749" font-size="22" fill="#263c3b">，文档记录迁移与恢复步骤。</text>

<text x="90" y="4857" font-size="19" fill="#8d503a">23</text>
<text x="90" y="4895" font-size="25" fill="#263c3b">文档与决策记录</text>
<text x="350" y="4861" font-size="22" fill="#263c3b">记录运行方法、当前能力和重</text><text x="350" y="4893" font-size="22" fill="#263c3b">要选择的理由，保留替代方案</text><text x="350" y="4925" font-size="22" fill="#263c3b">与后果，方便以后的人恢复决</text><text x="350" y="4957" font-size="22" fill="#263c3b">策背景。</text>
<text x="680" y="4861" font-size="22" fill="#263c3b">当继续 PromptHub 经验复用研究</text><text x="680" y="4893" font-size="22" fill="#263c3b">，需要分清已有结论、接入设想和</text><text x="680" y="4925" font-size="22" fill="#263c3b">未验证能力，避免下次重新猜测时</text><text x="680" y="4957" font-size="22" fill="#263c3b">。</text>
<text x="1060" y="4861" font-size="22" fill="#263c3b">沿用现有文档约定→记录背景、选择与取舍→核</text><text x="1060" y="4893" font-size="22" fill="#263c3b">对命令和来源→更新状态；决定改变时关联保留</text><text x="1060" y="4925" font-size="22" fill="#263c3b">历史。</text>
<text x="1560" y="4861" font-size="22" fill="#263c3b">交付可执行说明和决策记录；每项能</text><text x="1560" y="4893" font-size="22" fill="#263c3b">力有来源或实测依据，研究结论、候</text><text x="1560" y="4925" font-size="22" fill="#263c3b">选方案和实现状态清楚。</text>
<text x="1960" y="4861" font-size="22" fill="#263c3b">规格写要交付什么，决策记录解释</text><text x="1960" y="4893" font-size="22" fill="#263c3b">为何这样选；上下文组织按需读取</text><text x="1960" y="4925" font-size="22" fill="#263c3b">，Git 让文档对应具体版本。</text>

<text x="90" y="5071" font-size="25" fill="#263c3b">运行观测与诊断信</text><text x="90" y="5103" font-size="25" fill="#263c3b">息</text>
<text x="350" y="5037" font-size="22" fill="#263c3b">围绕实际诊断问题设计日志、</text><text x="350" y="5069" font-size="22" fill="#263c3b">指标和追踪，让运行中发生的</text><text x="350" y="5101" font-size="22" fill="#263c3b">错误与耗时有证据可以回查。</text>
<text x="680" y="5037" font-size="22" fill="#263c3b">如果卡片偶发缺图或演出未完成，</text><text x="680" y="5069" font-size="22" fill="#263c3b">单凭“没显示”无法区分资料缺失</text><text x="680" y="5101" font-size="22" fill="#263c3b">、资源加载和渲染失败时。</text>
<text x="1060" y="5037" font-size="22" fill="#263c3b">先定要回答的问题→选择最少信号→关联入口与</text><text x="1060" y="5069" font-size="22" fill="#263c3b">阶段→保护正文→触发故障检查；信号应能支持</text><text x="1060" y="5101" font-size="22" fill="#263c3b">定位。</text>
<text x="1560" y="5037" font-size="22" fill="#263c3b">交付事件字段、错误分类和查看方法</text><text x="1560" y="5069" font-size="22" fill="#263c3b">；在测试副本触发缺图，能凭事件定</text><text x="1560" y="5101" font-size="22" fill="#263c3b">位阶段，日志不含私人正文。</text>
<text x="1960" y="5037" font-size="22" fill="#263c3b">为调试提供线索，为性能优化提供</text><text x="1960" y="5069" font-size="22" fill="#263c3b">测量入口，为发布提供观察依据；</text><text x="1960" y="5101" font-size="22" fill="#263c3b">安全检查限制记录与访问范围。</text>

<text x="90" y="5231" font-size="25" fill="#263c3b">发布与上线验证</text>
<text x="350" y="5197" font-size="22" fill="#263c3b">把确定的版本交到目标环境，</text><text x="350" y="5229" font-size="22" fill="#263c3b">并检查关键用户路径、观察信</text><text x="350" y="5261" font-size="22" fill="#263c3b">号和恢复安排，核实真正可以</text><text x="350" y="5293" font-size="22" fill="#263c3b">使用。</text>
<text x="680" y="5197" font-size="22" fill="#263c3b">如果学习导览和回查页准备发布到</text><text x="680" y="5229" font-size="22" fill="#263c3b">总库站点，需要检查编号子路径、</text><text x="680" y="5261" font-size="22" fill="#263c3b">资源地址与判断备份迁移时。</text>

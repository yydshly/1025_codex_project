<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">内容与交互统一设计方法</title>
  <desc id="desc">围绕同一个理解目标，内容明确关系，视觉让关系可见，讲解引导注意，操作改变条件，反馈说明原因。场景按提问、预测、演示、操作、解释和迁移组织。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d8d3c8" stroke-width="0.7" opacity="0.42"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 8 5 0 9" fill="none" stroke="#8d8271" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1440" height="810" fill="#f5f1e8"/>
  <rect width="1440" height="810" fill="url(#grid)"/>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="80" y="80" font-size="18" letter-spacing="3" fill="#82634d">003 / 主题体验设计</text>
    <text x="80" y="143" font-size="44" font-weight="700" fill="#273b38">让内容、讲解与操作说同一件事</text>
    <text x="80" y="185" font-size="22" fill="#5d6c66">讲到什么，就让用户看到什么；需要理解什么，就安排相应的操作。</text>
    <g stroke="#8d8271" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
      <path d="M720 340V390H180V438"/>
      <path d="M720 340V390H450V438"/>
      <path d="M720 340V438"/>
      <path d="M720 340V390H990V438"/>
      <path d="M720 340V390H1260V438"/>
    </g>
    <rect x="480" y="240" width="480" height="100" rx="18" fill="#273b38"/>
    <text x="720" y="281" text-anchor="middle" font-size="29" font-weight="700" fill="#fffaf0">同一个理解目标</text>
    <text x="720" y="314" text-anchor="middle" font-size="18" fill="#d8e2d6">用户最后能解释、判断或完成什么</text>
    <g fill="#fffcf5" stroke="#c6bda9" stroke-width="1.3">
      <rect x="70" y="443" width="220" height="128" rx="14"/>
      <rect x="340" y="443" width="220" height="128" rx="14"/>
      <rect x="610" y="443" width="220" height="128" rx="14"/>
      <rect x="880" y="443" width="220" height="128" rx="14"/>
      <rect x="1150" y="443" width="220" height="128" rx="14"/>
    </g>
    <g text-anchor="middle" fill="#273b38" font-size="29" font-weight="700">
      <text x="180" y="491">内容</text>
      <text x="450" y="491">视觉</text>
      <text x="720" y="491">讲解</text>
      <text x="990" y="491">操作</text>
      <text x="1260" y="491">反馈</text>
    </g>
    <g text-anchor="middle" fill="#657269" font-size="19">
      <text x="180" y="532">明确要理解的关系</text>
      <text x="450" y="532">让关系变得可见</text>
      <text x="720" y="532">引导当下的注意</text>
      <text x="990" y="532">改变相关的条件</text>
      <text x="1260" y="532">说明结果与原因</text>
    </g>
    <path d="M80 626H1360" stroke="#c6bda9"/>
    <text x="80" y="674" font-size="18" fill="#82634d">每个场景</text>
    <text x="80" y="723" font-size="30" font-weight="600" fill="#273b38">提问 → 预测 → 演示 → 操作 → 解释 → 迁移</text>
    <text x="1360" y="772" text-anchor="end" font-size="16" fill="#7b8578">原创方法示意 / 2026.10.26</text>
  </g>
</svg>

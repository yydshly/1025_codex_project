<footer class="bottom"><div class="caption"><div class="caption-icon" aria-hidden="true">✳</div><div><strong>把日子骑成喜欢的样子</strong><span>一段轻轻的海边旅程</span></div></div><div class="controls"><button id="toggle" type="button" aria-pressed="false">暂停骑行</button><button id="speed" type="button" aria-pressed="false">加快一点</button></div><div class="footer-note">ENJOY THE RIDE&nbsp; ↗</div></footer>
</article></main>
<script>
const scene = document.getElementById('scene');
const toggle = document.getElementById('toggle');
const speed = document.getElementById('speed');
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
let paused = reducedMotion.matches;
let fast = false;
function update() {
  scene.classList.toggle('motion-paused', paused);
  scene.classList.toggle('fast', fast);
  toggle.textContent = paused ? '继续骑行' : '暂停骑行';
  toggle.setAttribute('aria-pressed', String(paused));
  speed.textContent = fast ? '慢一点' : '加快一点';
  speed.setAttribute('aria-pressed', String(fast));
}
toggle.addEventListener('click', () => { paused = !paused; update(); });
speed.addEventListener('click', () => { fast = !fast; update(); });
update();
</script>
</body>
</html>

name: Publish research web pages

on:
  push:
    branches: [main]
    paths:
      - 'projects/001-early-directions-atlas/**'
      - 'projects/004-baocut-effects-atlas/**'
      - 'projects.json'
      - 'pages.config.json'
      - 'scripts/build-pages.mjs'
      - 'scripts/pages.test.mjs'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check registry and publication boundary
        run: |
          npm run check
          npm run check:pages
          npm --prefix projects/001-early-directions-atlas run check
      - name: Prepare BaoCut research page and public media
        run: npm --prefix projects/004-baocut-effects-atlas run build:site
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build selected public files
        run: npm run build:pages
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Publish research web pages

on:
  push:
    branches: [main]
    paths:
      - 'projects/001-early-directions-atlas/**'
      - 'projects/003-unified-learning-design/**'
      - 'projects/002-ink-rain-alley/**'
      - 'projects/005-paper-poetics-lab/**'
      - 'projects/004-baocut-effects-atlas/**'
      - 'projects/008-ultraman-card-draw/**'
      - 'projects/009-knowledge-processing-atlas/**'
      - 'projects/010-agent-skills-engineering-lab/**'
      - 'projects.json'
      - 'pages.config.json'
      - 'scripts/build-pages.mjs'
      - 'scripts/pages.test.mjs'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            projects/002-ink-rain-alley/package-lock.json
            projects/005-paper-poetics-lab/package-lock.json
      - name: Install storytelling project dependencies
        run: |
          npm --prefix projects/002-ink-rain-alley ci
          npm --prefix projects/005-paper-poetics-lab ci
      - name: Check registry and publication boundary
        run: |
          npm run check
          npm run check:pages
          npm --prefix projects/001-early-directions-atlas run check
          npm --prefix projects/003-unified-learning-design run check
          npm --prefix projects/003-unified-learning-design test
          npm --prefix projects/003-unified-learning-design run test:publication
          npm --prefix projects/002-ink-rain-alley run check
          npm --prefix projects/002-ink-rain-alley test
          npm --prefix projects/005-paper-poetics-lab run check
          for script in projects/008-ultraman-card-draw/app/*.js; do node --check "$script"; done
          node --check projects/009-knowledge-processing-atlas/app/app.js
      - name: Check Agent Skills guide and prepare public files
        run: |
          python projects/010-agent-skills-engineering-lab/scripts/verify-snapshot.py
          node projects/010-agent-skills-engineering-lab/scripts/build-overview.mjs --check
          node projects/010-agent-skills-engineering-lab/scripts/build-scenarios.mjs --check
          node projects/010-agent-skills-engineering-lab/scripts/build-recall.mjs --check
          node --test projects/010-agent-skills-engineering-lab/tests/recall.test.mjs
          python -B projects/010-agent-skills-engineering-lab/tests/skill-recall.test.py
          node --test projects/010-agent-skills-engineering-lab/tests/publication.test.mjs
          node projects/010-agent-skills-engineering-lab/scripts/build-site.mjs --ref "$GITHUB_SHA"
      - name: Prepare BaoCut research page and public media
        run: npm --prefix projects/004-baocut-effects-atlas run build:site
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare unified learning publication
        run: npm --prefix projects/003-unified-learning-design run prepare:pages
      - name: Build selected public files
        run: |
          npm --prefix projects/005-paper-poetics-lab run build
          npm run build:pages
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
